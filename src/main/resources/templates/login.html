<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | CondoGestor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <main class="login-page">
        <section class="login-layout" aria-label="Acesso demonstrativo ao sistema">
            <div class="login-intro">
                <div>
                    <a class="brand" th:href="@{/login}" aria-label="CondoGestor, pagina inicial">
                        <span class="brand-mark" aria-hidden="true">C</span>
                        <span>
                            <span class="brand-name">CondoGestor</span>
                            <span class="brand-caption">Sistema de condomínios</span>
                        </span>
                    </a>
                    <h1>Gestão clara para uma rotina mais tranquila.</h1>
                    <p>Uma visão organizada das pessoas, unidades, ocorrências e reservas do condomínio.</p>
                </div>
        
            </div>

            <div class="login-form-panel">
                <div class="login-form-content">
                    <h2>Acesso ao Sistema</h2>
                    <p>Use suas credenciais para acessar o sistema.</p>
                    <form th:action="@{/login}" method="post">
                        <div class="form-field">
                            <label for="email">E-mail</label>
                            <input id="email" name="email" type="email" placeholder="Digite seu e-mail" required />
                        </div>
                        <div class="form-field stack-top-20">
                            <label for="password">Senha</label>
                            <input id="password" name="password" type="password" placeholder="Digite sua senha" required />
                        </div>
                        <p id="login-erro" class="form-error" th:if="${erro}" th:text="${erro}">E-mail ou senha inválidos.</p>
                        <button class="button button-primary" type="submit">Acessar</button>
                    </form>
                    <p class="footer-note">Não tem uma conta? <a>Cadastre-se</a></p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
