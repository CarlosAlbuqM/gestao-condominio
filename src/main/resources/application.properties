# Configurações do servidor
server.port=8080

# Configurações do Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Configurações da aplicação
spring.application.name=CondoGestor

server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always

# Lê o arquivo .env da raiz do projeto (ele fica fora do Git)
spring.config.import=optional:file:.env[.properties]


# Configurações do Banco de Dados - Neon (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Spring Security - desabilitar form de login padrão (usaremos o nosso)
spring.security.user.name=admin
spring.security.user.password={noop}desabilitado
