# Configurações do servidor
server.port=8080

# Configurações do Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Configurações da aplicação
spring.application.name=CondoGestor

server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always

# Configurações do Banco de Dados - Neon (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-delicate-glitter-b68mhoep.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_pJtWrelLV7Y6}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Spring Security - desabilitar form de login padrão (usaremos o nosso)
spring.security.user.name=admin
spring.security.user.password={noop}desabilitado
